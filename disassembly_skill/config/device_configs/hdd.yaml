device:
  class: hdd
  model: hdd
  dimensions_mm:
    length: 147.0
    width: 101.6
    height: 26.1
  material: mixed
  fixturing: gripper_only
  notes: "Single working HDD config aligned with the fine-tuned HDD disassembly skills from dev_ws."

components:
  case:
    label: case
    type: chassis
    removable: false
    notes: "Main structural base. Always secure this before unscrewing, pickup, flip, or flip_drop."
  pcb:
    label: pcb
    type: board
    removable: true
    notes: "Logic board on the first accessible side. This is the only part intended for pickup."
  lid:
    label: lid
    type: lid
    removable: true
    notes: "Detach after lid screws are removed. Clear it with flip_drop, not pickup."

screw_zones:
  pcb_screw:
    parent_component: pcb
    screw_count: 4
    screw_type: torx
    depends_on_removal_of: []
    notes: "Initial screw zone on the PCB side."
  lid_screw:
    parent_component: lid
    screw_count: 6
    screw_type: torx
    depends_on_removal_of:
      - pcb
    notes: "Second screw zone exposed after the HDD is flipped."

disassembly_sequence:
  - step: 1
    action: hold
    label: "Clamp HDD sideways for PCB side"
    target: case
    depends_on_steps: []
    reveals:
      - pcb_screw
      - pcb
    parameters:
      strategy: lateral_clamp
      # Labels accepted as valid hold targets (searched in order when primary label is absent)
      holdable_labels: [case, lid]
      grip_width_mm: 101.6
      approach_axis: "+x"
      flip_approach: false
      tilt_deg: 0.0
      gripper_open_deg: 35.0
      gripper_close_deg: -35.0
      gripper_close_force_n: 100.0
      torque_threshold_nm: 3.0
      use_tactile_descent: true
      descent_speed_mps: 0.030
      descent_rate_hz: 50.0
      descent_step_m: 0.00060
      hover_x_offset_m: 0.015
      hover_y_offset_m: 0.0
      hover_z_offset: 0.05
      approach_rpy_deg: [12.0, -82.0, 74.0]
      descent_distance_m: 0.12
      final_z_offset_m: 0.0
      approach_velocity: 0.50
      hover_velocity: 0.50
      grip_velocity: 0.03

  - step: 2
    action: unscrew
    label: "Remove PCB screws"
    target: pcb_screw
    depends_on_steps: [1]
    reveals: []
    parameters:
      screw_type: torx
      screw_count: 4
      engagement_depth_mm: 5.0
      descent_max_distance_m: 0.060
      initial_torque_nm: 0.5
      max_torque_nm: 1.5
      rotation_speed_rpm: 60
      force_threshold_n: 5.0
      align_tolerance_px: 4.0
      spiral_timeout_s: 30.0
      coarse_planner: exotica
      coarse_only_debug: false
      align_only_debug: false
      descent_only_debug: false
      coarse_position_tolerance_m: 0.010
      # Fixed coarse approach height (overrides depth-derived hover_z).
      # Run with coarse_only_debug: true, read the "[DIAG] hover_z" line
      # for each screw, then set this to a consistent safe value (e.g. 0.980).
      coarse_hover_z_m: ~            # null = depth-derived (noisy); set once calibrated
      screw_camera_z_min_m: 0.45
      screw_camera_z_max_m: 0.65
      screw_world_z_min_m: 0.90
      screw_world_z_max_m: 1.05
      pre_retract_m: 0.0
      xy_speed_align_mps: 0.060
      z_speed_descent_mps: 0.020
      spiral_start_dist_mm: 2.0
      spiral_gap_mm: 2.0
      spiral_speed_mps: 0.002
      search_max_step_m: 0.001
      search_joint_smooth_alpha: 0.35
      visual_servo_gain: 0.8
      visual_servo_max_radius_m: 0.025
      align_move_step_m: 0.0005
      align_verify_tolerance_m: 0.015
      align_error_filter_alpha: 0.25
      align_target_filter_alpha: 0.25
      align_stable_cycles: 3
      align_only_timeout_s: 90.0
      align_full_speed_error_px: 150.0
      align_min_speed_mps: 0.012
      align_z_lock_gain: 1.2
      align_z_lock_speed_mps: 0.003
      align_target_wait_s: 3.0
      align_target_lost_grace_s: 0.6
      enable_spiral_search: true
      align_rate_hz: 30.0
      align_joint_alpha: 0.20
      align_max_joint_step_rad: 0.020
      align_max_joint_velocity_rad_s: 0.6
      pre_descent_align_tolerance_px: 65.0
      pre_descent_align_timeout_s: 45.0
      pre_descent_align_stable_cycles: 1
      final_align_tolerance_px: 5.0
      final_align_timeout_s: 20.0
      final_align_max_radius_m: 0.012
      final_align_stable_cycles: 1
      final_align_xy_speed_mps: 0.006
      final_align_min_speed_mps: 0.002
      final_align_error_filter_alpha: 0.15
      unscrew_probe_duration_s: 0.50
      unscrew_probe_force_increase_n: 0.15
      unscrew_min_spin_s: 1.0
      unscrew_max_spin_s: 4.0
      unscrew_release_force_ratio: 0.35
      unscrew_force_ideal_delta_n: 0.15
      unscrew_force_deadband_n: 0.04
      unscrew_z_relief_gain_mps_per_n: 0.003
      unscrew_z_relief_speed_cap_mps: 0.008
      unscrew_z_relief_max_m: 0.030
      tool_release_settle_s: 0.50
      tool_grab_settle_s: 0.50
    notes: "Unscrew remains generic; this zone ordering makes it HDD-specific."

  - step: 3
    action: pickup
    label: "Extract PCB"
    target: pcb
    depends_on_steps: [2]
    reveals:
      - lid_screw
      - lid
    parameters:
      grasp_type: precision
      grip_width_mm: 80.0
      gripper_open_deg: 35.0
      gripper_close_deg: -35.0
      gripper_open_min_width_mm: 120.0
      gripper_close_force_n: 40.0
      approach_axis: "+z"
      lift_height_mm: 50.0
      lift_speed_mps: 0.01
      precondition_retract_m: 0.10
      move_xarm5_clearance: false
      approach_x_offset_m: -0.02
      approach_y_offset_m: 0.015
      approach_z_offset_m: 0.0
      hover_velocity: 0.50
      descent_distance_m: 0.080
      descent_step_m: 0.0005
      descent_rate_hz: 25.0
      accept_max_depth_without_contact: true
      descent_accept_ratio: 0.85
      torque_threshold_nm: 3.0
      contact_retract_m: 0.005
      contact_retract_velocity: 0.02
      post_grasp_retract_m: 0.030
      drop_x: 0.92
      drop_y: -0.36
      drop_z: 0.99
      skip_if_not_detected: true   # skip gracefully when PCB not visible (already removed / occluded)
    notes: "Pickup target and approach offsets are config-driven; current HDD sequence uses it for PCB extraction."

  - step: 4
    action: hold
    label: "Re-secure chassis after PCB pickup"
    target: case
    depends_on_steps: [3]
    reveals: []
    parameters:
      strategy: lateral_clamp
      holdable_labels: [case, lid]
      grip_width_mm: 101.6
      approach_axis: "+x"
      flip_approach: false
      tilt_deg: 0.0
      gripper_open_deg: 35.0
      gripper_close_deg: -35.0
      gripper_close_force_n: 100.0
      torque_threshold_nm: 3.0
      use_tactile_descent: true
      descent_speed_mps: 0.030
      descent_rate_hz: 50.0
      descent_step_m: 0.00060
      hover_x_offset_m: 0.015
      hover_y_offset_m: 0.0
      hover_z_offset: 0.05
      approach_rpy_deg: [12.0, -82.0, 74.0]
      descent_distance_m: 0.12
      final_z_offset_m: 0.0
      approach_velocity: 0.50
      hover_velocity: 0.50
      grip_velocity: 0.03


  - step: 5
    action: flip
    label: "Flip HDD to lid side"
    target: case
    depends_on_steps: [4]
    reveals:
      - lid_screw
    parameters:
      retract_height_m: 0.10
      gripper_close_force_n: 100.0
      torque_threshold_nm: 3.0
      rotation_deg: 180
    notes: "Matches the HDD-specific flip assumption from dev_ws."

  - step: 6
    action: hold
    label: "Re-secure chassis after flip"
    target: case
    depends_on_steps: [5]
    reveals: []
    parameters:
      strategy: lateral_clamp
      holdable_labels: [case, lid]
      grip_width_mm: 101.6
      approach_axis: "+x"
      flip_approach: false
      tilt_deg: 0.0
      gripper_open_deg: 35.0
      gripper_close_deg: -35.0
      gripper_close_force_n: 100.0
      torque_threshold_nm: 3.0
      use_tactile_descent: true
      descent_speed_mps: 0.030
      descent_rate_hz: 50.0
      descent_step_m: 0.00060
      hover_x_offset_m: 0.015
      hover_y_offset_m: 0.0
      hover_z_offset: 0.05
      approach_rpy_deg: [12.0, -82.0, 74.0]
      descent_distance_m: 0.12
      final_z_offset_m: 0.0
      approach_velocity: 0.50
      hover_velocity: 0.50
      grip_velocity: 0.03

  - step: 7
    action: unscrew
    label: "Remove lid screws"
    target: lid_screw
    depends_on_steps: [6]
    reveals: []
    parameters:
      screw_type: torx
      screw_count: 6
      engagement_depth_mm: 5.0
      descent_max_distance_m: 0.060
      initial_torque_nm: 0.5
      max_torque_nm: 1.5
      rotation_speed_rpm: 60
      force_threshold_n: 5.0
      align_tolerance_px: 4.0
      spiral_timeout_s: 30.0
      coarse_planner: exotica
      coarse_only_debug: false
      align_only_debug: false
      descent_only_debug: false
      coarse_position_tolerance_m: 0.010
      # Fixed coarse approach height (overrides depth-derived hover_z).
      # Run with coarse_only_debug: true, read the "[DIAG] hover_z" line
      # for each screw, then set this to a consistent safe value (e.g. 0.980).
      coarse_hover_z_m: ~            # null = depth-derived (noisy); set once calibrated
      screw_camera_z_min_m: 0.45
      screw_camera_z_max_m: 0.65
      screw_world_z_min_m: 0.90
      screw_world_z_max_m: 1.05
      pre_retract_m: 0.0
      xy_speed_align_mps: 0.060
      z_speed_descent_mps: 0.020
      spiral_start_dist_mm: 2.0
      spiral_gap_mm: 2.0
      spiral_speed_mps: 0.002
      search_max_step_m: 0.001
      search_joint_smooth_alpha: 0.35
      visual_servo_gain: 0.8
      visual_servo_max_radius_m: 0.025
      align_move_step_m: 0.0005
      align_verify_tolerance_m: 0.015
      align_error_filter_alpha: 0.25
      align_target_filter_alpha: 0.25
      align_stable_cycles: 3
      align_only_timeout_s: 90.0
      align_full_speed_error_px: 150.0
      align_min_speed_mps: 0.012
      align_z_lock_gain: 1.2
      align_z_lock_speed_mps: 0.003
      align_target_wait_s: 3.0
      align_target_lost_grace_s: 0.6
      enable_spiral_search: true
      align_rate_hz: 30.0
      align_joint_alpha: 0.20
      align_max_joint_step_rad: 0.020
      align_max_joint_velocity_rad_s: 0.6
      pre_descent_align_tolerance_px: 65.0
      pre_descent_align_timeout_s: 45.0
      pre_descent_align_stable_cycles: 1
      final_align_tolerance_px: 5.0
      final_align_timeout_s: 20.0
      final_align_max_radius_m: 0.012
      final_align_stable_cycles: 1
      final_align_xy_speed_mps: 0.006
      final_align_min_speed_mps: 0.002
      final_align_error_filter_alpha: 0.15
      unscrew_probe_duration_s: 0.50
      unscrew_probe_force_increase_n: 0.15
      unscrew_min_spin_s: 1.0
      unscrew_max_spin_s: 4.0
      unscrew_release_force_ratio: 0.35
      unscrew_force_ideal_delta_n: 0.15
      unscrew_force_deadband_n: 0.04
      unscrew_z_relief_gain_mps_per_n: 0.003
      unscrew_z_relief_speed_cap_mps: 0.008
      unscrew_z_relief_max_m: 0.030
      tool_release_settle_s: 0.50
      tool_grab_settle_s: 0.50
    notes: "Run on the lid-facing side after the PCB is gone and the HDD has been flipped."

  - step: 8
    action: flip_drop
    label: "Flip-drop loose top lid"
    target: lid
    depends_on_steps: [7]
    reveals: []
    parameters:
      retract_height_m: 0.05
      retract_velocity: 0.30
      retract_step_m: 0.025
      gripper_close_force_n: 100.0
      use_pickup_drop_xyz: true
      pickup_drop_z_offset_m: 0.04
      intermediate_x: 0.92
      intermediate_y: -0.36
      intermediate_z: 0.99
      drop_transfer_velocity: 0.40
      drop_transfer_step_m: 0.050
      drop_min_reachable_y: -0.54
      drop_accept_x_tolerance_m: 0.05
      drop_accept_y_tolerance_m: 0.06
      drop_accept_z_tolerance_m: 0.08
      wrist_rotation_velocity: 0.15
    notes: "The lid is a non-delicate module, so clear it with flip_drop."

metadata:
  version: 1
  author: adip
  created_with: disassembly_skill.device_config_builder
  notes: "Single HDD config for this workspace, intentionally aligned to the old dev_ws HDD disassembly behavior."
