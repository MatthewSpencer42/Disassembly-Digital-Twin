device:
  class: hdd
  model: hdd
  dimensions_mm:
    length: 147.0
    width: 101.6
    height: 26.1
  material: mixed
  fixturing: gripper_only
  notes: "Single working HDD config aligned with the fine-tuned HDD disassembly skills from dev_ws."

components:
  case:
    label: case
    type: chassis
    removable: false
    notes: "Main structural base. Always secure this before unscrewing, pickup, flip, or pickup."
  pcb:
    label: pcb
    type: board
    removable: true
    notes: "Logic board on the first accessible side. Picked up after pcb_screw unscrewed."
  lid:
    label: lid
    type: lid
    removable: true
    notes: "Picked up after lid screws are removed (HDD flipped to lid side)."

screw_zones:
  pcb_screw:
    parent_component: pcb
    screw_count: 4
    screw_type: torx
    depends_on_removal_of: []
    notes: "Initial screw zone on the PCB side."
  lid_screw:
    parent_component: lid
    screw_count: 6
    screw_type: torx
    depends_on_removal_of:
      - pcb
    notes: "Second screw zone exposed after the HDD is flipped."

disassembly_sequence:

  # ── Step 1: Unscrew lid screws ────────────────────────────────────────────
  - step: 1
    action: unscrew
    label: "Remove lid screws"
    target: lid_screw
    depends_on_steps: []
    reveals: []
    parameters:
      screw_type: torx
      screw_count: 6
      # Interactive Skip is used to reject false-positive screw detections.
      user_skip_counts_as_resolved: true
      engagement_depth_mm: 5.0
      descent_max_distance_m: 0.060
      initial_torque_nm: 0.5
      max_torque_nm: 1.5
      rotation_speed_rpm: 60
      force_threshold_n: 5.0
      align_tolerance_px: 4.0
      spiral_timeout_s: 30.0
      coarse_planner: exotica
      coarse_only_debug: false
      align_only_debug: false
      descent_only_debug: false
      coarse_position_tolerance_m: 0.010
      # Fixed screwdriver_tcp height from RViz; avoids depth-derived hover drift.
      coarse_hover_z_m: 0.98624
      coarse_velocity: 0.20
      screw_camera_z_min_m: 0.45
      screw_camera_z_max_m: 0.65
      screw_world_z_min_m: 0.90
      screw_world_z_max_m: 1.05
      pre_retract_m: 0.0
      xy_speed_align_mps: 0.060
      z_speed_descent_mps: 0.020
      spiral_start_dist_mm: 2.0
      spiral_gap_mm: 2.0
      spiral_speed_mps: 0.002
      search_max_step_m: 0.001
      search_joint_smooth_alpha: 0.35
      visual_servo_gain: 0.8
      visual_servo_max_radius_m: 0.025
      align_move_step_m: 0.0005
      align_verify_tolerance_m: 0.015
      align_error_filter_alpha: 0.25
      align_target_filter_alpha: 0.25
      align_stable_cycles: 3
      align_only_timeout_s: 90.0
      align_full_speed_error_px: 150.0
      align_min_speed_mps: 0.012
      align_z_lock_gain: 1.2
      align_z_lock_speed_mps: 0.003
      align_target_wait_s: 3.0
      align_target_lost_grace_s: 0.6
      enable_spiral_search: true
      align_rate_hz: 30.0
      align_joint_alpha: 0.20
      align_max_joint_step_rad: 0.020
      align_max_joint_velocity_rad_s: 0.6
      pre_descent_align_tolerance_px: 65.0
      pre_descent_align_timeout_s: 45.0
      pre_descent_align_stable_cycles: 1
      final_align_tolerance_px: 3.0
      final_align_timeout_s: 20.0
      final_align_max_radius_m: 0.012
      final_align_stable_cycles: 1
      final_align_xy_speed_mps: 0.006
      final_align_min_speed_mps: 0.002
      final_align_error_filter_alpha: 0.15
      unscrew_probe_duration_s: 0.50
      unscrew_probe_force_increase_n: 0.30
      unscrew_min_spin_s: 1.0
      unscrew_max_spin_s: 4.0
      unscrew_release_force_ratio: 0.50
      unscrew_release_debounce_s: 0.15    # s, sustained below release_level triggers success
      unscrew_force_ideal_delta_n: 0.15
      unscrew_force_deadband_n: 0.04
      unscrew_z_relief_gain_mps_per_n: 0.003
      unscrew_z_relief_speed_cap_mps: 0.008
      unscrew_z_relief_max_m: 0.030
      tool_release_settle_s: 0.50
      tool_grab_settle_s: 0.50
      skip_final_align_on_contact: true   # FT contact → go straight to unscrew
      use_screw_gripper: true
    notes: "Lid-side screws — first step before picking up the lid."

  # ── Step 2: Pick up lid ───────────────────────────────────────────────────
  - step: 2
    action: pickup
    label: "Extract lid"
    target: lid
    depends_on_steps: []
    reveals: []
    parameters:
      grasp_type: precision
      grip_width_mm: 85.0
      final_grip_width_mm: 85.0
      pre_grasp_width_mm: 120.0
      final_grip_width_tolerance_mm: 12.0
      gripper_open_deg: 35.0
      gripper_close_deg: -35.0
      gripper_open_min_width_mm: 120.0
      gripper_close_force_n: 40.0
      # Rotate joint6 by 90° at pre-grasp stop (30mm above part) before descent.
      wrist_joint6_deg: 90.0
      approach_axis: "+z"
      lift_height_mm: 20.0
      lift_speed_mps: 0.05
      precondition_retract_m: 0.20
      move_xarm5_clearance: false
      approach_x_offset_m: 0.0
      approach_y_offset_m: 0.0
      # −20 mm below vision centroid Z.
      approach_z_offset_m: -0.010
      approach_rpy_deg:
      home_approach_quat_xyzw: [0.55235, -0.30229, 0.51143, 0.58478]
      hover_velocity: 0.25
      descent_distance_m: 0.080
      descent_step_m: 0.0005
      descent_rate_hz: 25.0
      accept_max_depth_without_contact: true
      descent_accept_ratio: 0.85
      torque_threshold_nm: 3.0
      contact_retract_m: 0.005
      contact_retract_velocity: 0.02
      post_grasp_retract_m: 0.040
      drop_x: 0.92
      drop_y: -0.36
      drop_z: 0.99
      skip_if_not_detected: true
      z_extra_descent_mm: 0
    notes: >
      Lid removed first before flipping to expose PCB side.
      final_grip_width_mm controls final grasp width; pre_grasp_width_mm controls the pre-descent jaw width.
      wrist_joint6_deg 90 — tune once grasp geometry is confirmed.

  # ── Step 3: Hold case for flip ────────────────────────────────────────────
  - step: 3
    action: hold
    label: "Clamp chassis for flip"
    target: case
    depends_on_steps: []
    reveals: []
    parameters:
      strategy: lateral_clamp
      holdable_labels: [case, lid]
      # Command full close for HDD hold; the HDD body prevents zero-width closure.
      grip_width_mm: 0.0
      grip_contact_margin_mm: 0.0
      final_grip_width_tolerance_mm: 110.0
      approach_axis: "+x"
      flip_approach: false
      tilt_deg: 0.0
      gripper_open_deg: 35.0
      gripper_close_deg: -35.0
      gripper_close_force_n: 120.0
      torque_threshold_nm: 3.0
      use_tactile_descent: true
      descent_speed_mps: 0.030
      descent_rate_hz: 50.0
      descent_step_m: 0.00060
      min_contact_descent_m: 0.030
      contact_retract_min_success_m: 0.0025
      hover_x_offset_m: 0.015
      hover_y_offset_m: 0.003
      hover_z_offset: 0.04
      approach_rpy_deg: [12.0, -82.0, 74.0]
      descent_distance_m: 0.12
      final_z_offset_m: 0.0
      approach_velocity: 0.50
      hover_velocity: 0.25
      grip_velocity: 0.03

  # ── Step 4: Flip HDD ──────────────────────────────────────────────────────
  - step: 4
    action: flip
    label: "Flip HDD to PCB side"
    target: case
    depends_on_steps: []
    reveals:
      - pcb_screw
      - pcb
    parameters:
      retract_height_m: 0.10
      gripper_close_force_n: 100.0
      torque_threshold_nm: 3.0
      rotation_deg: 180
    notes: "Flips to expose PCB side after lid is removed."

  # ── Step 5: Unscrew PCB screws ────────────────────────────────────────────
  - step: 5
    action: unscrew
    label: "Remove PCB screws"
    target: pcb_screw
    depends_on_steps: []
    reveals: []
    parameters:
      screw_type: torx
      screw_count: 4
      # Interactive Skip is used to reject false-positive screw detections.
      user_skip_counts_as_resolved: true
      engagement_depth_mm: 5.0
      descent_max_distance_m: 0.060
      initial_torque_nm: 0.5
      max_torque_nm: 1.5
      rotation_speed_rpm: 60
      force_threshold_n: 5.0
      align_tolerance_px: 4.0
      spiral_timeout_s: 30.0
      coarse_planner: exotica
      coarse_only_debug: false
      align_only_debug: false
      descent_only_debug: false
      coarse_position_tolerance_m: 0.010
      # Fixed screwdriver_tcp height from RViz; avoids depth-derived hover drift.
      coarse_hover_z_m: 0.98624
      coarse_velocity: 0.20
      screw_camera_z_min_m: 0.45
      screw_camera_z_max_m: 0.65
      screw_world_z_min_m: 0.90
      screw_world_z_max_m: 1.05
      pre_retract_m: 0.0
      xy_speed_align_mps: 0.060
      z_speed_descent_mps: 0.020
      spiral_start_dist_mm: 2.0
      spiral_gap_mm: 2.0
      spiral_speed_mps: 0.002
      search_max_step_m: 0.001
      search_joint_smooth_alpha: 0.35
      visual_servo_gain: 0.8
      visual_servo_max_radius_m: 0.025
      align_move_step_m: 0.0005
      align_verify_tolerance_m: 0.015
      align_error_filter_alpha: 0.25
      align_target_filter_alpha: 0.25
      align_stable_cycles: 3
      align_only_timeout_s: 90.0
      align_full_speed_error_px: 150.0
      align_min_speed_mps: 0.012
      align_z_lock_gain: 1.2
      align_z_lock_speed_mps: 0.003
      align_target_wait_s: 3.0
      align_target_lost_grace_s: 0.6
      enable_spiral_search: true
      align_rate_hz: 30.0
      align_joint_alpha: 0.20
      align_max_joint_step_rad: 0.020
      align_max_joint_velocity_rad_s: 0.6
      pre_descent_align_tolerance_px: 65.0
      pre_descent_align_timeout_s: 45.0
      pre_descent_align_stable_cycles: 1
      final_align_tolerance_px: 3.0
      final_align_timeout_s: 20.0
      final_align_max_radius_m: 0.012
      final_align_stable_cycles: 1
      final_align_xy_speed_mps: 0.006
      final_align_min_speed_mps: 0.002
      final_align_error_filter_alpha: 0.15
      unscrew_probe_duration_s: 0.50
      unscrew_probe_force_increase_n: 0.30
      unscrew_min_spin_s: 1.0
      unscrew_max_spin_s: 4.0
      unscrew_release_force_ratio: 0.50
      unscrew_release_debounce_s: 0.15    # s, sustained below release_level triggers success
      unscrew_force_ideal_delta_n: 0.15
      unscrew_force_deadband_n: 0.04
      unscrew_z_relief_gain_mps_per_n: 0.003
      unscrew_z_relief_speed_cap_mps: 0.008
      unscrew_z_relief_max_m: 0.030
      tool_release_settle_s: 0.50
      tool_grab_settle_s: 0.50
      skip_final_align_on_contact: true   # FT contact → go straight to unscrew
      use_screw_gripper: true
    notes: "PCB-side screws — run after flipping."

  # ── Step 6: Pick up PCB ───────────────────────────────────────────────────
  - step: 6
    action: pickup
    label: "Extract PCB"
    target: pcb
    depends_on_steps: []
    reveals: []
    parameters:
      grasp_type: precision
      grip_width_mm: 40.0
      final_grip_width_mm: 35.0
      pre_grasp_width_mm: 80.0
      final_grip_width_tolerance_mm: 12.0
      gripper_open_deg: 35.0
      gripper_close_deg: -35.0
      gripper_open_min_width_mm: 120.0
      gripper_close_force_n: 100.0
      # Joint-6 wrist rotation applied at pre-grasp stop (before descent); 0 = no rotation.
      wrist_joint6_deg: 0.0
      approach_axis: "+z"
      lift_height_mm: 20.0
      lift_speed_mps: 0.05
      precondition_retract_m: 0.20
      move_xarm5_clearance: false
      approach_x_offset_m: -0.02
      approach_y_offset_m: 0.015
      # PCB is thin and flush; grasp slightly below the detected top surface.
      approach_z_offset_m: -0.001
      # Use the homed/current rg6_tcp orientation for PCB pickup. Forcing
      # [180, 0, 0] is not reachable at the HDD PCB hover pose on UF850.
      approach_rpy_deg:
      # Fallback from RViz UF850 home rg6_tcp orientation (xyzw). The skill
      # latches live home TF first; this is used only if TF is unavailable.
      home_approach_quat_xyzw: [0.55235, -0.30229, 0.51143, 0.58478]
      hover_velocity: 0.25
      descent_distance_m: 0.080
      descent_step_m: 0.0005
      descent_rate_hz: 25.0
      accept_max_depth_without_contact: true
      descent_accept_ratio: 0.85
      torque_threshold_nm: 3.0
      contact_retract_m: 0.005
      contact_retract_velocity: 0.02
      post_grasp_retract_m: 0.040
      drop_x: 0.92
      drop_y: -0.36
      drop_z: 0.99
      skip_if_not_detected: true   # skip gracefully when PCB not visible (already removed / occluded)
      z_extra_descent_mm: 0         # z offset above sets the PCB edge grasp depth
    notes: >
      final_grip_width_mm controls final PCB pickup grasp width; pre_grasp_width_mm controls the pre-descent jaw width.
      wrist_joint6_deg 0 for now — tune once grasp geometry is confirmed.

metadata:
  version: 3
  author: adip
  created_with: disassembly_skill.device_config_builder
  notes: >
    HDD 6-step sequence (updated): unscrew lid_screw → pickup lid → hold →
    flip → unscrew pcb_screw → pickup pcb.
    Lid side processed first, then flip to access PCB side.
    All parameter values unchanged from version 2.
