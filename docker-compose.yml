services:
  teleop:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-disassembly-teleop:humble
    container_name: agentic_disassembly_teleop
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /ws
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: ${XAUTHORITY:-}
      XDG_RUNTIME_DIR: /tmp/runtime-root
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/ws/src/agentic_disassembly
    devices:
      - /dev/video12:/dev/video12
      - /dev/video13:/dev/video13
      - /dev/video14:/dev/video14
      - /dev/video15:/dev/video15
      - /dev/media4:/dev/media4
      - /dev/media5:/dev/media5
    command: bash
