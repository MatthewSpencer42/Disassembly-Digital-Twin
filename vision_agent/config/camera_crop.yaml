camera_crop_republisher:
  ros__parameters:
    # Absolute pixel coordinates at 3840×2160.
    # Set crop_reference_width/height to 0 to use absolute coords (no scaling).
    crop_reference_width: 0
    crop_reference_height: 0
    crop_x: 1020
    crop_y: 470
    crop_width: 1900
    crop_height: 1020

    # /camera/cropped/color/image_raw        — full-res exact crop for geometry/debug
    # /camera/cropped/color/image_inference  — full-res crop for RF-DETR
    # /camera/cropped/color/image_display    — reduced-res preview for RViz/dashboard
    display_height: 480
    display_rate_divisor: 1
    inference_width: 0
    inference_height: 0
    publish_color_raw: true
    publish_color_compressed: false
    publish_display_compressed: false
    preferred_color_input: compressed
    color_input_stale_sec: 5.0
    preferred_color_fallback_sec: 1.0

    enable_depth: true
    depth_rate_divisor: 1

    enable_pointcloud: false
