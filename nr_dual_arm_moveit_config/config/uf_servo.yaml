use_gazebo: false
command_in_type: speed_units
scale:
  linear: 1.0
  rotational: 1.0
  joint: 0.5
butterworth_filter_coeff: 5.0
cartesian_command_in_topic: /uf_servo_node/delta_twist_cmds
joint_command_in_topic: /uf_servo_node/delta_joint_cmds
command_out_topic: /uf850_servo_controller/commands
command_out_type: std_msgs/Float64MultiArray
joint_topic: /joint_states
status_topic: /uf_servo_node/status
robot_link_command_frame: uf850_link6
planning_frame: base_link
ee_frame_name: uf850_link6
move_group_name: uf850_arm
is_primary_planning_scene_monitor: false
publish_period: 0.01
low_latency_mode: true
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
incoming_command_timeout: 0.5
num_outgoing_halt_msgs_to_publish: 4
