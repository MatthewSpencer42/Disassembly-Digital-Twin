[project]
name = "vision-training"
version = "0.1.0"
description = "Training environment for RF-DETR and YOLO experiments"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python>=4.9,<5",
    "pillow>=10,<12",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "supervision>=0.21,<1",
    "roboflow>=1.1,<2",
    "split-folders>=0.5,<1",
    "ultralytics>=8.3,<9",
    "rfdetr>=1.2,<2",
    "jupyterlab>=4,<5",
]

[tool.uv]
package = false
